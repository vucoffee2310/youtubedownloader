<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gemini TTS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h1 { text-align: center; color: #333; }
    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    select, button {
      padding: 10px 15px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #4285f4;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #3367d6; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    #status.error { background: #ffe0e0; color: #c00; }
    #status.success { background: #e0ffe0; color: #060; }
    #status.loading { background: #e0e0ff; color: #006; }
    #audioContainer { margin-top: 20px; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <h1>Gemini TTS</h1>
  <textarea id="text" placeholder="Enter text here...">Xin chào, tôi là trợ lý ảo</textarea>
  <div class="controls">
    <select id="lang">
      <option value="vi">Vietnamese</option>
      <option value="en">English</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh">Chinese</option>
      <option value="es">Spanish</option>
      <option value="th">Thai</option>
    </select>
    <button id="generate">Generate</button>
    <button id="clear">Clear</button>
  </div>
  <div id="status"></div>
  <div id="audioContainer"></div>
  <script src="tab.js"></script>
</body>
</html>
