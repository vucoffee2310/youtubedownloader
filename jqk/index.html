<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Overlay Editor</title>
    
    <!-- External Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/overlays.css" />
    <link rel="stylesheet" href="css/coordinates.css" />
    <link rel="stylesheet" href="css/modal.css" />
  </head>
  <body>
    <header id="controls">
      <div class="control-bar">
        
        <!-- File: PDF -->
        <label for="file-input" class="btn" title="Open PDF">
          <svg class="icon icon-accent" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <span class="text">PDF</span>
          <span id="pdf-file-name" class="badge">No file</span>
        </label>
        <input type="file" id="file-input" accept=".pdf" />

        <!-- File: JSON -->
        <label for="json-input" class="btn" title="Load JSON Data">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg>
          <span class="text">JSON</span>
          <span id="json-file-name" class="badge">Default</span>
        </label>
        <input type="file" id="json-input" accept=".json" />

        <div class="divider"></div>

        <!-- Settings Dropdown -->
        <details class="dropdown">
            <summary>
                <svg class="icon icon-dim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
                <svg class="icon chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
            </summary>
            <div class="dropdown-menu">
                <div class="slider-row">
                    <div class="slider-header">
                        <span>Overlay Opacity</span>
                        <span id="opacity-value">97%</span>
                    </div>
                    <input type="range" id="opacity-slider" min="1" max="100" value="97" />
                </div>
                <div class="slider-row">
                    <div class="slider-header">
                        <span>Text Brightness</span>
                        <span id="brightness-value">50%</span>
                    </div>
                    <input type="range" id="brightness-slider" min="0" max="100" value="50" />
                </div>
                <div class="slider-row">
                    <div class="slider-header">
                        <span>Char Spacing</span>
                        <span id="spacing-value">0.3em</span>
                    </div>
                    <input type="range" id="spacing-slider" min="10" max="100" value="30" />
                </div>
            </div>
        </details>

        <!-- Palette Dropdown -->
        <details class="dropdown">
            <summary>
                <svg class="icon icon-dim" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>
                Palette
                <svg class="icon chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
            </summary>
            <div class="dropdown-menu" style="min-width: 180px;">
                <div id="palette-container">
                    <span style="grid-column: 1/-1; font-size:11px; color:#666; text-align:center;">No colors loaded</span>
                </div>
            </div>
        </details>

        <div class="divider"></div>

        <!-- Coordinates -->
        <div class="coord-group">
            <button class="btn-coord" data-coord="T" title="Align Top">T</button>
            <button class="btn-coord" data-coord="L" title="Align Left">L</button>
            <button class="btn-coord" data-coord="B" title="Align Bottom">B</button>
            <button class="btn-coord" data-coord="R" title="Align Right">R</button>
        </div>
        <div id="coord-display" class="badge" style="background:transparent; border:1px solid #ddd;">TLBR</div>

        <div class="spacer"></div>

        <!-- Expand Group -->
        <div style="display:flex; align-items:center; gap: 4px; border-right: 1px solid var(--border-contrast); padding-right: 8px;">
            <label for="expand-amount" style="font-size:11px; color:var(--text-dim);">Exp:</label>
            <input type="number" id="expand-amount" value="5" min="1" max="100" step="0.5" title="Expand pixel amount" />
            <button id="expand-all-btn" class="btn btn-icon-only icon-accent" title="Apply Expand to All">
                <svg class="icon" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
        </div>

        <!-- Actions -->
        <button id="split-pdf-btn" class="btn btn-icon-only icon-accent" title="Split PDF Pages">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        </button>

        <button id="save-print-btn" class="btn btn-icon-only icon-accent" title="Print Document">
             <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        </button>

        <button id="save-direct-pdf-btn" class="btn btn-icon-only icon-accent" title="Download PDF">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </button>

        <!-- HTML Export Button (Updated) -->
        <button id="save-html-btn" class="btn btn-icon-only icon-accent" title="Export HTML">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        </button>

        <div class="divider"></div>

        <button id="theme-toggle" class="btn btn-icon-only" title="Toggle Dark/Light Theme">
             <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

      </div>
    </header>

    <main id="pdf-container">
      <div class="loading">Select a PDF file to begin</div>
    </main>

    <div id="split-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Split PDF Options</h2>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="split-option">
            <input type="radio" id="split-all" name="split-mode" value="all" checked />
            <label for="split-all"><strong>Split All Pages</strong><span class="option-desc">Export each page as individual PDF</span></label>
          </div>
          <div class="split-option">
            <input type="radio" id="split-by-files" name="split-mode" value="by-files" />
            <label for="split-by-files"><strong>Split by Number of Files</strong></label>
            <div class="option-input"><input type="number" id="num-files" min="2" max="100" value="5" /></div>
          </div>
          <div class="split-option">
             <input type="radio" id="split-by-pages" name="split-mode" value="by-pages" />
             <label for="split-by-pages"><strong>Split by Pages Per File</strong></label>
             <div class="option-input"><input type="number" id="pages-per-file" min="1" max="100" value="10" /></div>
          </div>
          <div class="split-option">
            <input type="radio" id="split-range" name="split-mode" value="range" />
            <label for="split-range"><strong>Export Page Range</strong></label>
            <div class="option-input">
              <input type="number" id="range-start" min="1" value="1" /> - 
              <input type="number" id="range-end" min="1" value="10" />
            </div>
          </div>
          <div class="split-option">
            <input type="radio" id="split-custom" name="split-mode" value="custom" />
            <label for="split-custom"><strong>Export Specific Pages</strong></label>
            <div class="option-input"><input type="text" id="custom-pages" placeholder="e.g., 1,5,10" style="background:var(--bg-root); border:1px solid var(--border-contrast); color:var(--text-main); padding:4px;" /></div>
          </div>
          <div class="modal-info">
            <p><strong>Total pages:</strong> <span id="modal-total-pages">0</span></p>
            <p><strong>Estimated output:</strong> <span id="modal-estimate">-</span></p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" id="modal-cancel" style="border:1px solid #444">Cancel</button>
          <button class="btn" id="modal-export" style="background:var(--accent-color); color:#fff; font-weight:600;">Export</button>
        </div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
